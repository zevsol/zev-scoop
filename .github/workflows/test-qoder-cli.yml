name: Test Qoder CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate current checkout
        shell: pwsh
        run: |
          python scripts/validate-manifest.py --check-url
          if ($LASTEXITCODE -ne 0) { throw 'Current checkout manifest validation failed.' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python unit tests failed.' }
      - name: Find a distinct historical manifest for upgrade test
        id: history
        shell: pwsh
        run: |
          $currentManifest = Get-Content bucket/qoder-cli.json -Raw | ConvertFrom-Json
          $current = [string]$currentManifest.version
          if ([string]::IsNullOrWhiteSpace($current)) {
            throw 'The current manifest has no version.'
          }

          $baselineCommit = $null
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $baseBranch = $env:GITHUB_BASE_REF
            if ([string]::IsNullOrWhiteSpace($baseBranch)) {
              throw 'GITHUB_BASE_REF is empty for a pull_request event.'
            }
            & git check-ref-format --branch $baseBranch | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Invalid pull request base branch name: $baseBranch"
            }

            $baseRef = "refs/remotes/origin/$baseBranch"
            $refMatches = @(& git for-each-ref --format='%(refname)' --count=1 $baseRef)
            if ($LASTEXITCODE -ne 0) {
              throw "git for-each-ref failed while checking $baseRef (exit $LASTEXITCODE)."
            }
            if (-not $refMatches -or $refMatches[0] -cne $baseRef) {
              throw "Expected fetched pull request base ref is missing: $baseRef"
            }

            $baselineCommit = (& git rev-parse --verify "$baseRef^{commit}") -join ''
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($baselineCommit)) {
              throw "git rev-parse could not resolve pull request base ref $baseRef (exit $LASTEXITCODE)."
            }
          }
          else {
            $headInfo = @(& git rev-list --parents -n 1 HEAD)
            if ($LASTEXITCODE -ne 0) {
              throw "git rev-list failed while inspecting HEAD (exit $LASTEXITCODE)."
            }
            if ($headInfo.Count -ne 1) {
              throw "git rev-list returned an unexpected result for HEAD: $($headInfo -join ' | ')"
            }

            $headParts = $headInfo[0] -split '\s+'
            if ($headParts.Count -gt 1) {
              $parentCommit = (& git rev-parse --verify "$($headParts[1])^{commit}") -join ''
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($parentCommit)) {
                throw "git rev-parse could not resolve the first parent of HEAD (exit $LASTEXITCODE)."
              }
              $baselineCommit = $parentCommit
            }
          }

          $reason = $null
          $previous = $null
          if (-not $baselineCommit) {
            $reason = 'no-history'
          }
          else {
            $treeEntries = @(& git ls-tree -r --name-only $baselineCommit -- 'bucket/qoder-cli.json')
            if ($LASTEXITCODE -ne 0) {
              throw "git ls-tree failed for baseline $baselineCommit (exit $LASTEXITCODE)."
            }
            if ($treeEntries -cnotcontains 'bucket/qoder-cli.json') {
              $reason = 'no-history'
            }
            else {
              $manifestObject = "$($baselineCommit):bucket/qoder-cli.json"
              $previousJson = (& git show $manifestObject) -join "`n"
              if ($LASTEXITCODE -ne 0) {
                throw "git show failed for confirmed historical manifest $manifestObject (exit $LASTEXITCODE)."
              }
              try {
                $previous = $previousJson | ConvertFrom-Json -ErrorAction Stop
              }
              catch {
                throw "Historical manifest at $manifestObject is not valid JSON: $($_.Exception.Message)"
              }
              if ([string]::IsNullOrWhiteSpace([string]$previous.version)) {
                throw "Historical manifest at $manifestObject has no version."
              }
              if ([string]$previous.version -eq $current) {
                $reason = 'same-version'
              }
            }
          }

          if ($reason) {
            $outputLines = @(
              'available=false',
              "reason=$reason",
              "previous_version=$(if ($previous) { [string]$previous.version } else { 'none' })",
              "current_version=$current"
            )
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $outputLines
            Write-Host "HISTORY=SKIPPED: $reason; current=$current"
          }
          else {
            $path = Join-Path $env:RUNNER_TEMP 'qoder-cli-previous.json'
            [IO.File]::WriteAllText($path, $previousJson, [Text.UTF8Encoding]::new($false))
            $outputLines = @(
              'available=true',
              "previous_version=$([string]$previous.version)",
              "current_version=$current",
              "manifest_path=$path"
            )
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $outputLines
            Write-Host "HISTORY=AVAILABLE: $([string]$previous.version) -> $current; manifest=$path"
          }
      - name: Test current manifest install, command, path, and uninstall
        if: ${{ !cancelled() && (success() || steps.history.conclusion == 'failure') }}
        shell: pwsh
        run: ./scripts/test-scoop.ps1 -Mode Install
      - name: Test upgrade from historical official package
        if: steps.history.outputs.available == 'true'
        shell: pwsh
        run: ./scripts/test-scoop.ps1 -Mode Upgrade -PreviousManifestPath '${{ steps.history.outputs.manifest_path }}'
      - name: Report upgrade test as skipped
        if: steps.history.outputs.available != 'true'
        shell: pwsh
        run: |
          $reason = '${{ steps.history.outputs.reason }}'
          "Upgrade test: SKIPPED ($reason) — no distinct historical manifest is available." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
